[package]
name = "rpg"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.16.0", features = ["bevy_remote", "dynamic_linking"] }
bevy-butler = "0.6.2"
bevy_asset_loader = { version = "0.23.0", features = [
    "2d",
    "progress_tracking",
    "standard_dynamic_assets",
] }
bevy_ecs_tilemap = "0.16.0"
leafwing-input-manager = "0.18.0"
rand = "0.9.2"
rand_chacha = "0.9.0"
serde_json = "1.0.145"
thiserror = "2.0.17"
ldtk_rust = { path = "external/ldtk_rust" }
bevy_rapier2d = { version = "0.31.0", features = ["debug-render-2d"] }


[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
