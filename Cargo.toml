[package]
name = "rpg"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.17.0", features = ["bevy_remote", "dynamic_linking"] }
bevy_asset_loader = { version = "0.24.0-rc.1", features = [
    "2d",
    "standard_dynamic_assets",
] }
bevy_ecs_tilemap = "0.17.0-rc.1"
rand = "0.9.2"
rand_chacha = "0.9.0"
serde_json = "1.0.145"
thiserror = "2.0.17"
ldtk_rust = { path = "external/ldtk_rust" }
bitflags = "2.9.4"
fastrand = "2.3.0"
bevy_rapier2d = { git = "https://github.com/lukasfri/bevy_rapier.git", branch = "master", features = [
    "debug-render-2d",
] }
seldom_state = { path = "external/seldom_state" }
serde = "1.0.228"
anyhow = "1.0.100"


[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
